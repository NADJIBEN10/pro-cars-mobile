kind = "mobile"
previewPath = "/"
title = "Rahand Cars"
version = "1.0.0"
id = "artifacts/rahand-cars"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23352

[services.development]
run = "pnpm --filter @workspace/rahand-cars run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rahand-cars", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rahand-cars", "run", "serve" ]

[services.env]
PORT = "23352"
BASE_PATH = "/"
